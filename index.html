<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Scroll</title>
<meta name="description" content="Office Scroll, a mobile game about scrolling your phone at work without getting caught.">
<style>
:root { --bg: #f6f4ee; --ink: #1c2140; --soft: #555b78; --card: #ffffff; --line: #e2dfd4; --accent: #c9860a; }
@media (prefers-color-scheme: dark) { :root { --bg: #14172b; --ink: #eef0fa; --soft: #a9afcc; --card: #1c2140; --line: #2c3256; --accent: #ffc94a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
header.site { max-width: 720px; margin: 0 auto; padding: 24px 20px 0; font-weight: 700; letter-spacing: .04em; }
header.site a { color: var(--accent); text-decoration: none; }
h1 { font-size: 30px; line-height: 1.2; margin: 12px 0 8px; }
h2 { font-size: 21px; margin: 36px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 24px 0 4px; }
p, li { color: var(--ink); }
.soft { color: var(--soft); }
a { color: var(--accent); }
ul { padding-left: 22px; }
li { margin: 6px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 16px 0; }
footer { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
<header class="site"><a href="/">OFFICE SCROLL</a></header>
<main>
<h1>Office Scroll</h1>
<p>A mobile game about scrolling your phone at work without getting caught.</p>
<div class="card">
<p><a href="/officescroll/support/">Support</a></p>
<p><a href="/officescroll/privacy/">Privacy policy</a></p>
</div>
</main>
<footer>&copy; 2026 Arjun Nair</footer>
</body>
</html>
